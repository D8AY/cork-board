<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cork — 우리 팀 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EDEFF2; --paper-raised:#FFFFFF; --ink:#1F2937; --ink-soft:#5B6472; --line:#D8DCE2;
    --teal:#2A9D8F; --teal-deep:#218074; --coral:#E76F51; --amber:#E9B949; --lavender:#8E7DBE;
    --sky:#4C93B0; --rose:#D46A9F; --olive:#7C9070; --slateblue:#6B7B8C;
    --radius:10px; --shadow-pin: 0 1px 0 rgba(31,41,55,.04), 0 6px 14px -8px rgba(31,41,55,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 1px 1px, rgba(31,41,55,.05) 1px, transparent 0) 0 0/16px 16px, var(--paper);
    color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  #app{max-width:920px;margin:0 auto;padding:20px 20px 80px;transition:max-width .15s;}
  #app.wide{max-width:1400px;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 18px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:white;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;box-shadow:var(--shadow-pin);transform:rotate(-4deg);}
  .brand-text .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;}
  .brand-text .sub{font-size:11px;color:var(--ink-soft);margin-top:-2px;}
  nav.tabs{display:flex;gap:6px;background:var(--paper-raised);padding:4px;border-radius:10px;border:1px solid var(--line);}
  nav.tabs button{border:none;background:transparent;padding:8px 16px;border-radius:7px;font-family:'Inter';font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;transition:.15s;}
  nav.tabs button.active{background:var(--ink);color:white;}
  nav.tabs button:not(.active):hover{color:var(--ink);}
  .whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .whoami b{color:var(--ink);}
  .whoami button{border:1px solid var(--line);background:var(--paper-raised);padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .roster{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 4px 20px;}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper-raised);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:.15s;}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .chip.active{border-color:transparent;color:white;}
  .chip:hover{transform:translateY(-1px);}
  .chip.add{border-style:dashed;color:var(--ink-soft);}
  .summary{display:flex;gap:12px;margin:0 4px 20px;flex-wrap:wrap;}
  .stat{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;min-width:100px;box-shadow:var(--shadow-pin);}
  .stat .n{font-family:'Space Grotesk';font-size:22px;font-weight:700;}
  .stat .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .stat.warn .n{color:var(--coral);}
  .add-task-btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:white;border:none;padding:10px 16px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;margin:0 4px 18px;}
  .add-task-btn:hover{background:#111827;}

  /* ---- Task groups (업무제목) ---- */
  .grouplist{display:flex;flex-direction:column;gap:14px;padding:0 4px;}
  .group-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-pin);}
  .group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .group-title{font-family:'Space Grotesk';font-weight:700;font-size:15.5px;}
  .group-actions{display:flex;gap:6px;flex:none;}
  .icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .icon-btn:hover{color:var(--ink);}
  .icon-btn.danger:hover{color:var(--coral);border-color:var(--coral);}

  .sub-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:8px;border-bottom:1px solid var(--paper);}
  .sub-row:last-child{border-bottom:none;}
  .sub-row:hover{background:var(--paper);}
  .status-pill{flex:none;border:none;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter';}
  .status-pill.todo{background:#E7E9EC;color:var(--ink-soft);}
  .status-pill.doing{background:#FCF1D8;color:#A87A15;}
  .status-pill.done{background:#DDEFEA;color:var(--teal-deep);}
  .sub-content-text{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;padding:3px 5px;border-radius:5px;}
  .sub-content-text:hover{background:#fff;box-shadow:0 0 0 1px var(--line) inset;}
  .sub-content-text.done{color:var(--ink-soft);text-decoration:line-through;}
  .assignee-stack{display:flex;align-items:center;flex:none;}
  .assignee-stack .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--paper-raised);margin-left:-6px;display:flex;align-items:center;justify-content:center;color:white;font-size:9px;font-weight:700;}
  .assignee-stack .dot:first-child{margin-left:0;}
  .sub-due{flex:none;font-family:'JetBrains Mono';font-size:10.5px;padding:3px 7px;border-radius:6px;background:var(--paper);color:var(--ink-soft);cursor:pointer;border:none;}
  .sub-due:hover{box-shadow:0 0 0 1px var(--line) inset;}
  .sub-due.overdue{background:#FBE4DC;color:var(--coral);}
  .inline-edit-input{font-size:13.5px;font-family:'Inter';border:1px solid var(--teal);border-radius:5px;padding:3px 5px;flex:1;min-width:0;}
  .inline-edit-date{font-size:11px;font-family:'JetBrains Mono';border:1px solid var(--teal);border-radius:5px;padding:2px 4px;flex:none;}
  .row-menu-btn{flex:none;border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;letter-spacing:1px;}
  .row-menu-btn:hover{background:var(--line);color:var(--ink);}
  .empty-sub{color:var(--ink-soft);font-size:12px;padding:10px 6px;}
  .sub-item{border-bottom:1px solid var(--paper);}
  .sub-item:last-child{border-bottom:none;}
  .sub-item .sub-row{border-bottom:none;}
  .sub-note-preview{font-size:11.5px;color:#9AA3AF;padding:0 6px 8px 44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty-state{color:var(--ink-soft);font-size:13px;text-align:center;padding:50px 10px;}

  .quick-add-row{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .quick-add-row input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;background:var(--paper);}
  .quick-add-row input[type=date]{flex:none;width:132px;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:12px;background:var(--paper);}
  .quick-add-row input:focus{outline:none;border-color:var(--teal);}
  .qa-submit{flex:none;border:none;background:var(--teal);color:white;border-radius:7px;padding:0 12px;font-size:12.5px;font-weight:700;cursor:pointer;height:32px;}
  .qa-submit:hover{background:var(--teal-deep);}
  .qa-detail{flex:none;border:1px solid var(--line);background:var(--paper-raised);border-radius:7px;width:32px;height:32px;font-size:14px;color:var(--ink-soft);cursor:pointer;}
  .qa-detail:hover{color:var(--ink);}

  /* ---- Calendar ---- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px;}
  .cal-head .m-title{font-family:'Space Grotesk';font-weight:700;font-size:20px;}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--paper-raised);cursor:pointer;font-size:15px;color:var(--ink-soft);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:0 4px;}
  .cal-dow{font-size:12px;color:var(--ink-soft);text-align:center;padding-bottom:6px;font-weight:700;}
  .cal-dow.weekend{color:var(--coral);}
  .cal-cell{background:var(--paper-raised);border:1px solid var(--line);border-radius:9px;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;}
  .cal-cell.out{opacity:.35;}
  .cal-cell.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
  .cal-cell:hover{border-color:var(--teal);}
  .cal-daynum{font-family:'JetBrains Mono';font-size:12px;color:var(--ink-soft);font-weight:600;}
  .cal-daynum.weekend{color:var(--coral);}
  .cal-holiday-label{font-size:9.5px;color:var(--coral);font-weight:700;margin:-2px 0 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-chip{font-size:11px;padding:3px 6px;border-radius:5px;color:white;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-more{font-size:10.5px;color:var(--ink-soft);padding:1px 2px;}

  .modal-day{background:var(--paper-raised);border-radius:16px;max-width:720px;width:95%;max-height:88vh;overflow-y:auto;padding:26px 26px 22px;box-shadow:0 25px 70px -25px rgba(0,0,0,.45);}
  .day-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .day-header .d-title{font-family:'Space Grotesk';font-size:22px;font-weight:700;}
  .day-header .d-count{font-size:12.5px;color:var(--ink-soft);}
  .day-close{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:32px;height:32px;font-size:16px;color:var(--ink-soft);cursor:pointer;flex:none;}
  .day-item{display:flex;align-items:center;gap:10px;padding:12px 8px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--paper);}
  .day-item:hover{background:var(--paper);}
  .day-item:last-child{border-bottom:none;}
  .day-item .di-group{flex:none;width:150px;font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .day-item .di-content{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .day-item .di-content.done{color:var(--ink-soft);text-decoration:line-through;}
  .day-empty{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:60px 10px;}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(31,41,55,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--paper-raised);border-radius:14px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 22px 20px;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);}
  .modal h3{font-family:'Space Grotesk';font-size:17px;margin:0 0 16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text], .field input[type=date], .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:'Inter';background:var(--paper);}
  .field-head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
  .field-head-row label{margin-bottom:0;}
  .notes-toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0;}
  .notes-toggle input{width:14px;height:14px;accent-color:var(--teal);}
  #s-notes{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:'Inter';background:var(--paper);resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .assignee-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .assignee-opt{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .assignee-opt.selected{color:white;border-color:transparent;}
  .assignee-opt .dot{width:8px;height:8px;border-radius:50%;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .btn.primary{background:var(--teal);color:white;}
  .btn.primary:hover{background:var(--teal-deep);}
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn.danger{background:transparent;color:var(--coral);}
  .btn.small{padding:7px 12px;font-size:12.5px;}

  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .onboard-card{background:var(--paper-raised);border-radius:16px;padding:30px 28px;max-width:460px;width:100%;box-shadow:0 20px 60px -25px rgba(0,0,0,.35);text-align:center;}
  .onboard-card .brand-mark{margin:0 auto 14px;}
  .onboard-card h2{font-family:'Space Grotesk';font-size:19px;margin:0 0 6px;}
  .onboard-card p{font-size:13px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5;}
  .member-add-row{display:flex;gap:8px;margin-bottom:10px;}
  .member-add-row input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;}
  .member-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;justify-content:center;}
  .name-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
  .name-pick button{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink);}
  .name-pick button:hover{border-color:var(--teal);}
  .loading-note{font-size:12px;color:var(--ink-soft);text-align:center;padding:40px 0;}
  .share-note{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.5;}
  .setup-card{background:var(--paper-raised);border-radius:16px;padding:30px 28px;max-width:560px;width:100%;box-shadow:0 20px 60px -25px rgba(0,0,0,.35);}
  .setup-card h2{font-family:'Space Grotesk';font-size:19px;margin:0 0 10px;}
  .setup-card ol{font-size:13.5px;line-height:1.8;padding-left:20px;}
  .setup-card code{background:var(--paper);padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono';font-size:12px;}
  .err-note{background:#FBE4DC;color:var(--coral);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:14px;}
</style>
</head>
<body>
<div id="app"><div class="loading-note">불러오는 중…</div></div>

<script>
/* =========================================================
   설정: Supabase 프로젝트를 만든 후 아래 두 값만 채워주세요.
   ========================================================= */
const SUPABASE_URL = 'https://wcljzyocvohahayqnywl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbGp6eW9jdm9oYWhheXFueXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MzgyNjQsImV4cCI6MjEwMzExNDI2NH0.ryTtkhzsOSWkW0f9e9xR4-fErifZ1G-OKDOvG6wRG3A';
/* ========================================================= */

const PALETTE = ['#2A9D8F','#E76F51','#8E7DBE','#4C93B0','#D46A9F','#7C9070','#E9B949','#6B7B8C'];
const STATUS = [{k:'todo',l:'할 일'},{k:'doing',l:'진행중'},{k:'done',l:'완료'}];
// 2026년 대한민국 공휴일 (공공데이터포털 특일정보 기준, 2026-08-23 확인)
const HOLIDAYS_KR = {
  '2026-01-01':'신정', '2026-02-16':'설날 연휴', '2026-02-17':'설날', '2026-02-18':'설날 연휴',
  '2026-03-01':'삼일절', '2026-03-02':'대체공휴일', '2026-05-01':'노동절', '2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날', '2026-05-25':'대체공휴일', '2026-06-03':'지방선거', '2026-06-06':'현충일',
  '2026-07-17':'제헌절', '2026-08-15':'광복절', '2026-08-17':'대체공휴일',
  '2026-09-24':'추석 연휴', '2026-09-25':'추석', '2026-09-26':'추석 연휴',
  '2026-10-03':'개천절', '2026-10-05':'대체공휴일', '2026-10-09':'한글날', '2026-12-25':'크리스마스',
};
const STATUS_RANK = {todo:0, doing:1, done:2};

const needsSetup = SUPABASE_URL.includes('YOUR_SUPABASE') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
let sb = null;
if(!needsSetup){ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

let state = {
  members: null, taskGroups: null, subtasks: null, me: null, tab: 'dashboard',
  filterMember: null, calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  modal: null, errorMsg: null,
};
let pendingFocusGroup = null; // 빠른입력 후 다시 포커스할 그룹 id

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '기한 없음'; const d=new Date(s+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate(); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function memberById(id){ return state.members.find(m=>m.id===id); }

/* ---------------- DATA LAYER (Supabase) ---------------- */
async function loadAll(){
  if(needsSetup){ render(); return; }
  try{
    const [{data: members, error:e1}, {data: groups, error:e2}, {data: subs, error:e3}] = await Promise.all([
      sb.from('members').select('*').order('created_at'),
      sb.from('task_groups').select('*').order('created_at'),
      sb.from('subtasks').select('*').order('created_at'),
    ]);
    if(e1) throw e1; if(e2) throw e2; if(e3) throw e3;
    state.members = members;
    state.taskGroups = groups.map(g=>({id:g.id, title:g.title}));
    state.subtasks = subs.map(s=>({
      id:s.id, taskGroupId:s.task_group_id, content:s.content, dueDate:s.due_date,
      status:s.status, assignees:s.assignees||[], notes:s.notes||'', showNotes:!!s.show_notes
    }));
    state.errorMsg = null;
  }catch(err){ state.errorMsg = (err && err.message) ? err.message : String(err); }
  render();
}
function subscribeRealtime(){
  if(needsSetup || !sb) return;
  sb.channel('cork-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'members'}, ()=> loadAll())
    .on('postgres_changes', {event:'*', schema:'public', table:'task_groups'}, ()=> loadAll())
    .on('postgres_changes', {event:'*', schema:'public', table:'subtasks'}, ()=> loadAll())
    .subscribe();
}
async function addMember(name){
  const color = PALETTE[state.members.length % PALETTE.length];
  const {error} = await sb.from('members').insert({name, color});
  if(error){ alert('팀원 추가 실패: '+error.message); return; }
  await loadAll();
}
async function removeMember(id){
  const {error} = await sb.from('members').delete().eq('id', id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  await loadAll();
}
async function addTaskGroup(title){
  const {error} = await sb.from('task_groups').insert({title});
  if(error){ alert('업무 추가 실패: '+error.message); return; }
  await loadAll();
}
async function deleteTaskGroup(id){
  if(!confirm('이 업무와 안의 모든 세부 업무가 삭제돼요. 계속할까요?')) return;
  const {error} = await sb.from('task_groups').delete().eq('id', id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  await loadAll();
}
async function upsertSubtask(sub, isNew){
  const row = {
    task_group_id: sub.taskGroupId, content: sub.content, due_date: sub.dueDate || null,
    status: sub.status, assignees: sub.assignees || [], notes: sub.notes || '', show_notes: !!sub.showNotes,
  };
  let error;
  if(isNew){ ({error} = await sb.from('subtasks').insert(row)); }
  else{ ({error} = await sb.from('subtasks').update(row).eq('id', sub.id)); }
  if(error){ alert('저장 실패: '+error.message); return false; }
  await loadAll();
  return true;
}
async function deleteSubtask(id){
  const {error} = await sb.from('subtasks').delete().eq('id', id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  await loadAll();
}
async function cycleStatus(sub){
  const order = ['todo','doing','done'];
  const next = order[(order.indexOf(sub.status)+1) % order.length];
  const {error} = await sb.from('subtasks').update({status: next}).eq('id', sub.id);
  if(error){ alert('상태 변경 실패: '+error.message); return; }
  await loadAll();
}

/* ---------------- CALENDAR ---------------- */
function renderCalendar(){
  const y = state.calMonth.getFullYear(), mo = state.calMonth.getMonth();
  const first = new Date(y, mo, 1); const startOffset = first.getDay();
  const daysInMonth = new Date(y, mo+1, 0).getDate(); const daysInPrev = new Date(y, mo, 0).getDate();
  const cells = [];
  for(let i=startOffset-1;i>=0;i--) cells.push({d:daysInPrev-i, out:true, y: mo===0?y-1:y, m: mo===0?11:mo-1});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, out:false, y, m:mo});
  while(cells.length % 7 !== 0 || cells.length < 35) cells.push({d:cells.length-startOffset-daysInMonth+1, out:true, y: mo===11?y+1:y, m: mo===11?0:mo+1});
  const subs = allVisibleSubtasks(); const byDate = {};
  subs.forEach(s=>{ if(s.dueDate){ (byDate[s.dueDate] = byDate[s.dueDate]||[]).push(s); } });
  const dowNames = ['일','월','화','수','목','금','토'];
  const dow = dowNames.map((n,i)=>`<div class="cal-dow ${(i===0||i===6)?'weekend':''}">${n}</div>`).join('');
  const cellsHtml = cells.map((c,idx)=>{
    const ds = c.y+'-'+String(c.m+1).padStart(2,'0')+'-'+String(c.d).padStart(2,'0');
    const isToday = ds === todayStr(); const items = (byDate[ds]||[]); const shown = items.slice(0,6); const more = items.length - shown.length;
    const col = idx % 7; const isWeekend = col===0 || col===6;
    const holidayName = HOLIDAYS_KR[ds];
    const isRed = isWeekend || !!holidayName;
    const chips = shown.map(s=>{ const m = memberById((s.assignees||[])[0]); return `<span class="cal-chip" style="background:${m?m.color:'#9AA3AF'}" data-open-sub="${s.id}">${escapeHtml(s.content)}</span>`; }).join('');
    return `<div class="cal-cell ${c.out?'out':''} ${isToday?'today':''}" data-open-day="${ds}">
      <div class="cal-daynum ${isRed?'weekend':''}">${c.d}</div>
      ${holidayName?`<div class="cal-holiday-label">${escapeHtml(holidayName)}</div>`:''}
      ${chips}${more>0?`<div class="cal-more">+${more}개 더</div>`:''}
    </div>`;
  }).join('');
  const monthLabel = y+'년 '+(mo+1)+'월';
  return `<div class="cal-head"><div class="m-title">${monthLabel}</div><div class="cal-nav"><button id="cal-prev">‹</button><button id="cal-next">›</button></div></div>
    <div class="cal-grid">${dow}${cellsHtml}</div>`;
}

    el.onclick = ()=>{
      const id = el.dataset.mid;
      if(selected.has(id)){ selected.delete(id); el.classList.remove('selected'); el.style.background=''; }
      else{ selected.add(id); el.classList.add('selected'); const mm=memberById(id); el.style.background = mm.color; }
    };
  });
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('cancel-modal').onclick = closeModal;
  if(!isNew){ document.getElementById('delete-sub').onclick = async ()=>{ await deleteSubtask(s.id); closeModal(); }; }
  document.getElementById('save-sub').onclick = async ()=>{
    const content = document.getElementById('s-content').value.trim();
    if(!content){ document.getElementById('s-content').focus(); return; }
    const payload = {
      id: isNew?null:s.id, taskGroupId: m.taskGroupId, content,
      dueDate: document.getElementById('s-due').value,
      status: document.getElementById('s-status').value,
      assignees: Array.from(selected),
      notes: document.getElementById('s-notes').value,
      showNotes: document.getElementById('s-shownotes').checked,
    };
    state.modal = null; // 저장 중 재렌더로 모달이 중복 생성되지 않도록 먼저 비움
    const ok = await upsertSubtask(payload, isNew);
    if(!ok){ /* 실패 시 별다른 처리 없음, alert로 이미 안내됨 */ }
    closeModal();
  };
  document.getElementById('s-content').focus();
}

/* ---------------- INLINE EDIT HELPERS ---------------- */
function startInlineContentEdit(row, sub){
  const span = row.querySelector(`[data-edit-content="${sub.id}"]`);
  if(!span) return;
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'inline-edit-input'; input.value = sub.content;
  span.replaceWith(input); input.focus(); input.select();
  let done = false;
  const commit = async ()=>{
    if(done) return; done = true;
    const val = input.value.trim();
    if(val && val !== sub.content){ await upsertSubtask({...sub, content: val}, false); }
    else{ render(); }
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter') input.blur();
    if(e.key==='Escape'){ done = true; render(); }
  });
}
function startInlineDueEdit(row, sub){
  const btn = row.querySelector(`[data-edit-due="${sub.id}"]`);
  if(!btn) return;
  const input = document.createElement('input');
  input.type = 'date'; input.className = 'inline-edit-date'; input.value = sub.dueDate || '';
  btn.replaceWith(input); input.focus();
  let done = false;
  const commit = async ()=>{
    if(done) return; done = true;
    await upsertSubtask({...sub, dueDate: input.value}, false);
  };
  input.addEventListener('change', commit);
  input.addEventListener('blur', ()=>{ if(!done){ done=true; render(); } });
}

/* ---------------- EVENTS ---------------- */
function attachShellEvents(){
  const appRoot = document.getElementById('app'); // 모달(overlay)은 body 직속이라 여기 범위에 안 들어옴 → 이벤트 중복 바인딩 방지
  appRoot.querySelectorAll('nav.tabs [data-tab]').forEach(b=>{ b.onclick=()=>{ state.tab=b.dataset.tab; render(); }; });
  document.getElementById('switch-me').onclick=()=>{ state.me=null; render(); };
  document.getElementById('add-member-chip').onclick=()=>{ document.getElementById('app').innerHTML=renderOnboarding(); attachOnboardEvents(); const d=document.getElementById('ob-done'); d.textContent='← 돌아가기'; d.onclick=()=>render(); };
  appRoot.querySelectorAll('#roster [data-filter]').forEach(c=>{ c.onclick=()=>{ const f=c.dataset.filter; state.filterMember=(f==='__all__')?null:(state.filterMember===f?null:f); render(); }; });

  const newGroupBtn = document.getElementById('new-group-btn');
  if(newGroupBtn) newGroupBtn.onclick = openGroupModal;

  appRoot.querySelectorAll('[data-del-group]').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); deleteTaskGroup(b.dataset.delGroup); }; });

  // 상태 배지 클릭 → 순환
  appRoot.querySelectorAll('[data-cycle]').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); const s=state.subtasks.find(x=>x.id===b.dataset.cycle); if(s) cycleStatus(s); }; });

  // 인라인 내용 수정
  appRoot.querySelectorAll('[data-edit-content]').forEach(span=>{
    span.onclick = ()=>{
      const id = span.dataset.editContent;
      const s = state.subtasks.find(x=>x.id===id);
      const row = span.closest('[data-sub-row]');
      if(s && row) startInlineContentEdit(row, s);
    };
  });
  // 인라인 기한 수정
  appRoot.querySelectorAll('[data-edit-due]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.editDue;
      const s = state.subtasks.find(x=>x.id===id);
      const row = btn.closest('[data-sub-row]');
      if(s && row) startInlineDueEdit(row, s);
    };
  });
  // 자세히(⋯) / 캘린더 칩 → 담당자·상태 모달
  appRoot.querySelectorAll('[data-open-sub]').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const id = el.dataset.openSub;
      const s = state.subtasks.find(x=>x.id===id);
      if(s) openSubModal('edit', s.taskGroupId, id);
    };
  });
  // 캘린더 날짜 칸 클릭 → 그 날 전체보기 (칩 클릭은 위에서 stopPropagation 되어 여기로 안 옴)
  appRoot.querySelectorAll('[data-open-day]').forEach(cell=>{
    cell.onclick = ()=> openDayModal(cell.dataset.openDay);
  });

  // 빠른 추가 (할일 + 기한, Enter/버튼)
  appRoot.querySelectorAll('[data-qa-submit]').forEach(btn=>{
    btn.onclick = ()=> submitQuickAdd(btn.dataset.qaSubmit);
  });
  appRoot.querySelectorAll('[data-qa-content]').forEach(inp=>{
    inp.onkeydown = (e)=>{ if(e.key==='Enter') submitQuickAdd(inp.dataset.qaContent); };
  });
  // 빠른 추가 옆 ⋯ → 담당자까지 지정해서 새로 만들기 (입력해둔 값 이어받음)
  appRoot.querySelectorAll('[data-qa-detail]').forEach(btn=>{
    btn.onclick = ()=>{
      const gid = btn.dataset.qaDetail;
      const contentEl = appRoot.querySelector(`[data-qa-content="${gid}"]`);
      const dueEl = appRoot.querySelector(`[data-qa-due="${gid}"]`);
      openSubModal('new', gid, null, {content: contentEl?contentEl.value.trim():'', dueDate: dueEl?dueEl.value:''});
    };
  });

  if(state.tab==='calendar'){
    const prev=document.getElementById('cal-prev'), next=document.getElementById('cal-next');
    if(prev) prev.onclick=()=>{ state.calMonth=new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()-1, 1); render(); };
    if(next) next.onclick=()=>{ state.calMonth=new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+1, 1); render(); };
  }
}
async function submitQuickAdd(groupId){
  const contentEl = document.querySelector(`[data-qa-content="${groupId}"]`);
  const dueEl = document.querySelector(`[data-qa-due="${groupId}"]`);
  const content = contentEl ? contentEl.value.trim() : '';
  if(!content){ if(contentEl) contentEl.focus(); return; }
  const dueDate = dueEl ? dueEl.value : '';
  pendingFocusGroup = groupId;
  await upsertSubtask({taskGroupId: groupId, content, dueDate, status:'todo', assignees: state.me?[state.me]:[]}, true);
}

/* ---------------- INIT ---------------- */
loadAll();
subscribeRealtime();
document.addEventListener('click', (e)=>{ if(e.target && e.target.id==='retry-btn') loadAll(); });
</script>
