<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cork — 우리 팀 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EDEFF2; --paper-raised:#FFFFFF; --ink:#1F2937; --ink-soft:#5B6472; --line:#D8DCE2;
    --teal:#2A9D8F; --teal-deep:#218074; --coral:#E76F51; --amber:#E9B949; --lavender:#8E7DBE;
    --sky:#4C93B0; --rose:#D46A9F; --olive:#7C9070; --slateblue:#6B7B8C;
    --radius:10px; --shadow-pin: 0 1px 0 rgba(31,41,55,.04), 0 6px 14px -8px rgba(31,41,55,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 1px 1px, rgba(31,41,55,.05) 1px, transparent 0) 0 0/16px 16px, var(--paper);
    color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  #app{max-width:1180px;margin:0 auto;padding:20px 20px 80px;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 18px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:white;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;box-shadow:var(--shadow-pin);transform:rotate(-4deg);}
  .brand-text .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;}
  .brand-text .sub{font-size:11px;color:var(--ink-soft);margin-top:-2px;}
  nav.tabs{display:flex;gap:6px;background:var(--paper-raised);padding:4px;border-radius:10px;border:1px solid var(--line);}
  nav.tabs button{border:none;background:transparent;padding:8px 16px;border-radius:7px;font-family:'Inter';font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;transition:.15s;}
  nav.tabs button.active{background:var(--ink);color:white;}
  nav.tabs button:not(.active):hover{color:var(--ink);}
  .whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .whoami b{color:var(--ink);}
  .whoami button{border:1px solid var(--line);background:var(--paper-raised);padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .roster{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 4px 20px;}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper-raised);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:.15s;}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .chip.active{border-color:transparent;color:white;}
  .chip:hover{transform:translateY(-1px);}
  .chip.add{border-style:dashed;color:var(--ink-soft);}
  .summary{display:flex;gap:12px;margin:0 4px 20px;flex-wrap:wrap;}
  .stat{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;min-width:110px;box-shadow:var(--shadow-pin);}
  .stat .n{font-family:'Space Grotesk';font-size:22px;font-weight:700;}
  .stat .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .stat.warn .n{color:var(--coral);}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 4px;}
  @media (max-width:820px){.board{grid-template-columns:1fr;}}
  .col{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:120px;}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px;}
  .col-head .name{font-family:'Space Grotesk';font-weight:600;font-size:13.5px;}
  .col-head .count{font-family:'JetBrains Mono';font-size:11px;background:var(--ink);color:white;padding:1px 7px;border-radius:999px;}
  .cardlist{display:flex;flex-direction:column;gap:10px;min-height:40px;}
  .task-card{background:var(--paper-raised);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:9px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow-pin);transition:transform .12s;}
  .task-card:hover{transform:translateY(-2px) rotate(-.3deg);}
  .task-card .t-title{font-weight:600;font-size:13.5px;line-height:1.35;margin-bottom:6px;}
  .task-card .t-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);}
  .badge{padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:600;}
  .badge.due{font-family:'JetBrains Mono';background:var(--paper);}
  .badge.due.overdue{background:#FBE4DC;color:var(--coral);}
  .badge.pr-high{background:#FBE4DC;color:var(--coral);}
  .badge.pr-mid{background:#FCF1D8;color:#A87A15;}
  .badge.pr-low{background:#E4EFEA;color:var(--olive);}
  .t-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
  .tag{font-size:10px;background:var(--paper);border:1px solid var(--line);padding:1px 6px;border-radius:5px;color:var(--ink-soft);}
  .progress-wrap{display:flex;align-items:center;gap:6px;margin-top:7px;}
  .progress-bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-bar>div{height:100%;background:var(--teal);}
  .progress-txt{font-family:'JetBrains Mono';font-size:10px;color:var(--ink-soft);}
  .empty-col{color:var(--ink-soft);font-size:12px;text-align:center;padding:20px 6px;}
  .add-task-btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:white;border:none;padding:10px 16px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;margin:0 4px 18px;}
  .add-task-btn:hover{background:#111827;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px;}
  .cal-head .m-title{font-family:'Space Grotesk';font-weight:700;font-size:18px;}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--paper-raised);cursor:pointer;font-size:14px;color:var(--ink-soft);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 4px;}
  .cal-dow{font-size:11px;color:var(--ink-soft);text-align:center;padding-bottom:4px;font-weight:600;}
  .cal-cell{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px;}
  .cal-cell.out{opacity:.35;}
  .cal-cell.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
  .cal-daynum{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-soft);}
  .cal-chip{font-size:10.5px;padding:2px 5px;border-radius:5px;color:white;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-more{font-size:10px;color:var(--ink-soft);cursor:pointer;}
  .overlay{position:fixed;inset:0;background:rgba(31,41,55,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--paper-raised);border-radius:14px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 22px 20px;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);}
  .modal h3{font-family:'Space Grotesk';font-size:17px;margin:0 0 16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text], .field input[type=date], .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:'Inter';background:var(--paper);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .subtask-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .subtask-row input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--teal);}
  .subtask-row span{flex:1;font-size:13px;}
  .subtask-row span.done{text-decoration:line-through;color:var(--ink-soft);}
  .subtask-row button{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:2px 6px;}
  .subtask-add{display:flex;gap:6px;margin-top:4px;}
  .subtask-add input{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:var(--paper);}
  .subtask-add button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:0 12px;cursor:pointer;font-weight:600;color:var(--ink-soft);}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .btn.primary{background:var(--teal);color:white;}
  .btn.primary:hover{background:var(--teal-deep);}
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn.danger{background:transparent;color:var(--coral);}
  .btn.small{padding:7px 12px;font-size:12.5px;}
  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .onboard-card{background:var(--paper-raised);border-radius:16px;padding:30px 28px;max-width:460px;width:100%;box-shadow:0 20px 60px -25px rgba(0,0,0,.35);text-align:center;}
  .onboard-card .brand-mark{margin:0 auto 14px;}
  .onboard-card h2{font-family:'Space Grotesk';font-size:19px;margin:0 0 6px;}
  .onboard-card p{font-size:13px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5;}
  .member-add-row{display:flex;gap:8px;margin-bottom:10px;}
  .member-add-row input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;}
  .member-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;justify-content:center;}
  .name-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
  .name-pick button{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink);}
  .name-pick button:hover{border-color:var(--teal);}
  .loading-note{font-size:12px;color:var(--ink-soft);text-align:center;padding:40px 0;}
  .share-note{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.5;}
  .setup-card{background:var(--paper-raised);border-radius:16px;padding:30px 28px;max-width:560px;width:100%;box-shadow:0 20px 60px -25px rgba(0,0,0,.35);}
  .setup-card h2{font-family:'Space Grotesk';font-size:19px;margin:0 0 10px;}
  .setup-card ol{font-size:13.5px;line-height:1.8;padding-left:20px;}
  .setup-card code{background:var(--paper);padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono';font-size:12px;}
  .err-note{background:#FBE4DC;color:var(--coral);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:14px;}
</style>
</head>
<body>
<div id="app"><div class="loading-note">불러오는 중…</div></div>

<script>
/* =========================================================
   설정: Supabase 프로젝트를 만든 후 아래 두 값만 채워주세요.
   Supabase 대시보드 → Project Settings → API 에서 확인 가능
   ========================================================= */
const SUPABASE_URL = 'https://wcljzyocvohahayqnywl.supabase.co';
const SUPABASE_ANON_KEY ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbGp6eW9jdm9oYWhheXFueXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MzgyNjQsImV4cCI6MjEwMzExNDI2NH0.ryTtkhzsOSWkW0f9e9xR4-fErifZ1G-OKDOvG6wRG3A';
/* ========================================================= */

const PALETTE = ['#2A9D8F','#E76F51','#8E7DBE','#4C93B0','#D46A9F','#7C9070','#E9B949','#6B7B8C'];
const STATUS = [{k:'todo',l:'할 일'},{k:'doing',l:'진행중'},{k:'done',l:'완료'}];
const PRIORITY = [{k:'low',l:'낮음'},{k:'mid',l:'보통'},{k:'high',l:'높음'}];

const needsSetup = SUPABASE_URL.includes('YOUR_SUPABASE') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
let sb = null;
if(!needsSetup){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let state = {
  members: null, tasks: null, me: null, tab: 'dashboard',
  filterMember: null, calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  modalTask: null, errorMsg: null,
};

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '날짜 없음'; const d=new Date(s+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate(); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function memberById(id){ return state.members.find(m=>m.id===id); }

/* ---------------- DATA LAYER (Supabase) ---------------- */
async function loadAll(){
  if(needsSetup){ render(); return; }
  try{
    const [{data: members, error: e1}, {data: tasks, error: e2}] = await Promise.all([
      sb.from('members').select('*').order('created_at'),
      sb.from('tasks').select('*').order('created_at'),
    ]);
    if(e1) throw e1;
    if(e2) throw e2;
    state.members = members;
    state.tasks = tasks.map(t=>({
      id:t.id, title:t.title, assignee:t.assignee, dueDate:t.due_date,
      status:t.status, priority:t.priority, tags:t.tags||[], subtasks:t.subtasks||[]
    }));
    state.errorMsg = null;
  }catch(err){
    state.errorMsg = (err && err.message) ? err.message : String(err);
  }
  render();
}

function subscribeRealtime(){
  if(needsSetup || !sb) return;
  sb.channel('cork-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'members'}, ()=> loadAll())
    .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, ()=> loadAll())
    .subscribe();
}

async function addMember(name){
  const color = PALETTE[state.members.length % PALETTE.length];
  const {error} = await sb.from('members').insert({name, color});
  if(error){ alert('팀원 추가 실패: '+error.message); return; }
  await loadAll();
}
async function removeMember(id){
  const {error} = await sb.from('members').delete().eq('id', id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  await loadAll();
}
async function upsertTask(task, isNew){
  const row = {
    title: task.title, assignee: task.assignee || null, due_date: task.dueDate || null,
    status: task.status, priority: task.priority, tags: task.tags, subtasks: task.subtasks,
  };
  let error;
  if(isNew){
    ({error} = await sb.from('tasks').insert(row));
  }else{
    ({error} = await sb.from('tasks').update(row).eq('id', task.id));
  }
  if(error){ alert('저장 실패: '+error.message); return false; }
  await loadAll();
  return true;
}
async function deleteTask(id){
  const {error} = await sb.from('tasks').delete().eq('id', id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  await loadAll();
}

/* ---------------- RENDER ROOT ---------------- */
function render(){
  const app = document.getElementById('app');
  if(needsSetup){ app.innerHTML = renderSetupScreen(); return; }
  if(state.errorMsg){ app.innerHTML = renderErrorScreen(); return; }
  if(state.members === null || state.tasks === null){ app.innerHTML = '<div class="loading-note">불러오는 중…</div>'; return; }
  if(state.members.length === 0){ app.innerHTML = renderOnboarding(); attachOnboardEvents(); return; }
  if(state.me === null){ app.innerHTML = renderIdentityPick(); attachIdentityEvents(); return; }
  app.innerHTML = renderShell();
  attachShellEvents();
}

function renderSetupScreen(){
  return `<div class="center-screen"><div class="setup-card">
    <div class="brand-mark display">C</div>
    <h2>Supabase 연결이 필요해요</h2>
    <p style="font-size:13px;color:var(--ink-soft)">이 파일은 아직 데이터베이스에 연결되지 않았어요. 아래 순서대로 채워주세요.</p>
    <ol>
      <li><a href="https://supabase.com" target="_blank">supabase.com</a>에서 무료 프로젝트를 만드세요.</li>
      <li>SQL Editor에서 <code>supabase-schema.sql</code> 내용을 실행하세요.</li>
      <li>Project Settings → API에서 <code>Project URL</code>과 <code>anon public key</code>를 복사하세요.</li>
      <li>이 파일 상단의 <code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code> 값을 붙여넣고 저장하세요.</li>
    </ol>
  </div></div>`;
}
function renderErrorScreen(){
  return `<div class="center-screen"><div class="setup-card">
    <div class="brand-mark display" style="background:var(--coral)">!</div>
    <h2>연결에 문제가 있어요</h2>
    <div class="err-note">${escapeHtml(state.errorMsg)}</div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:14px">Supabase URL/키가 올바른지, SQL 스키마를 실행했는지 확인해주세요.</p>
    <button class="btn primary small" id="retry-btn" style="margin-top:8px">다시 시도</button>
  </div></div>`;
}

/* ---------------- ONBOARDING ---------------- */
function renderOnboarding(){
  return `<div class="center-screen"><div class="onboard-card">
    <div class="brand-mark display">C</div>
    <h2>Cork에 오신 것을 환영해요</h2>
    <p>우리 팀 5~6명의 이름을 먼저 등록해주세요.<br>등록한 팀원은 대시보드와 캘린더에서 색으로 구분돼요.</p>
    <div class="member-add-row"><input id="ob-input" type="text" placeholder="팀원 이름 입력 후 Enter"><button class="btn primary small" id="ob-add">추가</button></div>
    <div class="member-list" id="ob-list"></div>
    <button class="btn primary" id="ob-done" style="width:100%">보드 시작하기 →</button>
    <div class="share-note">이 앱은 여러분의 Supabase 프로젝트에 저장돼요. 링크를 아는 팀원 모두가 같은 데이터를 함께 봅니다.</div>
  </div></div>`;
}
function renderMemberChipsForOnboard(){
  const wrap = document.getElementById('ob-list'); if(!wrap) return;
  wrap.innerHTML = state.members.map(m=>`
    <span class="chip" style="border-color:${m.color}55"><span class="dot" style="background:${m.color}"></span>${escapeHtml(m.name)}
    <button data-rm="${m.id}" style="border:none;background:none;color:var(--ink-soft);cursor:pointer;margin-left:2px;">×</button></span>`
  ).join('') || '<span style="font-size:12px;color:var(--ink-soft)">아직 추가된 팀원이 없어요</span>';
  wrap.querySelectorAll('[data-rm]').forEach(b=>{ b.onclick = ()=> removeMember(b.dataset.rm); });
}
function attachOnboardEvents(){
  renderMemberChipsForOnboard();
  const input = document.getElementById('ob-input');
  const addBtn = document.getElementById('ob-add');
  const doneBtn = document.getElementById('ob-done');
  async function doAdd(){ const name = input.value.trim(); if(!name) return; input.value=''; await addMember(name); document.getElementById('ob-input')?.focus(); }
  addBtn.onclick = doAdd;
  input.onkeydown = (e)=>{ if(e.key==='Enter') doAdd(); };
  doneBtn.onclick = ()=>{ if(state.members.length===0){ input.focus(); return; } render(); };
  input.focus();
}

/* ---------------- IDENTITY PICK ---------------- */
function renderIdentityPick(){
  return `<div class="center-screen"><div class="onboard-card">
    <div class="brand-mark display">C</div>
    <h2>누구신가요?</h2>
    <p>본인 이름을 선택하면 업무를 만들 때 담당자가 자동 지정돼요.</p>
    <div class="name-pick" id="id-pick">${state.members.map(m=>`<button data-id="${m.id}"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${m.color};display:inline-block"></span>${escapeHtml(m.name)}</button>`).join('')}</div>
    <button class="btn ghost small" id="id-manage">+ 팀원 추가/관리</button>
  </div></div>`;
}
function attachIdentityEvents(){
  document.querySelectorAll('#id-pick [data-id]').forEach(b=>{ b.onclick = ()=>{ state.me = b.dataset.id; render(); }; });
  document.getElementById('id-manage').onclick = ()=>{ document.getElementById('app').innerHTML = renderOnboarding(); attachOnboardEvents(); const d=document.getElementById('ob-done'); d.textContent='← 돌아가기'; d.onclick = ()=>render(); };
}

/* ---------------- SHELL ---------------- */
function renderShell(){
  const me = memberById(state.me);
  return `
    <header class="topbar">
      <div class="brand"><div class="brand-mark display">C</div><div class="brand-text"><div class="title">Cork</div><div class="sub">우리 팀의 코르크보드</div></div></div>
      <nav class="tabs"><button data-tab="dashboard" class="${state.tab==='dashboard'?'active':''}">대시보드</button><button data-tab="calendar" class="${state.tab==='calendar'?'active':''}">캘린더</button></nav>
      <div class="whoami"><span>안녕하세요, <b>${escapeHtml(me?me.name:'')}</b>님</span><button id="switch-me">전환</button></div>
    </header>
    <div class="roster" id="roster">${renderRosterChips()}<span class="chip add" id="add-member-chip">+ 팀원</span></div>
    ${state.tab==='dashboard' ? renderDashboard() : renderCalendar()}
  `;
}
function renderRosterChips(){
  const all = `<span class="chip ${state.filterMember===null?'active':''}" data-filter="__all__" style="${state.filterMember===null?'background:var(--ink)':''}">전체</span>`;
  const chips = state.members.map(m=>{
    const active = state.filterMember===m.id;
    return `<span class="chip ${active?'active':''}" data-filter="${m.id}" style="${active?`background:${m.color}`:''}"><span class="dot" style="background:${m.color}"></span>${escapeHtml(m.name)}</span>`;
  }).join('');
  return all + chips;
}
function visibleTasks(){ let list = state.tasks; if(state.filterMember) list = list.filter(t=>t.assignee===state.filterMember); return list; }

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const tasks = visibleTasks();
  const overdue = tasks.filter(t=>t.status!=='done' && t.dueDate && t.dueDate < todayStr()).length;
  const doneCount = tasks.filter(t=>t.status==='done').length;
  const doingCount = tasks.filter(t=>t.status==='doing').length;
  const summary = `<div class="summary">
    <div class="stat"><div class="n mono">${tasks.length}</div><div class="l">전체 업무</div></div>
    <div class="stat"><div class="n mono">${doingCount}</div><div class="l">진행중</div></div>
    <div class="stat"><div class="n mono">${doneCount}</div><div class="l">완료</div></div>
    <div class="stat ${overdue>0?'warn':''}"><div class="n mono">${overdue}</div><div class="l">기한 초과</div></div>
  </div>`;
  const addBtn = `<button class="add-task-btn" id="new-task-btn">＋ 새 업무 만들기</button>`;
  const cols = STATUS.map(s=>{
    const items = tasks.filter(t=>t.status===s.k).sort((a,b)=> (a.dueDate||'9999')<(b.dueDate||'9999')?-1:1);
    const cards = items.map(renderTaskCard).join('') || `<div class="empty-col">업무 없음</div>`;
    return `<div class="col"><div class="col-head"><span class="name">${s.l}</span><span class="count mono">${items.length}</span></div><div class="cardlist" data-status="${s.k}">${cards}</div></div>`;
  }).join('');
  return summary + addBtn + `<div class="board">${cols}</div>`;
}
function renderTaskCard(t){
  const m = memberById(t.assignee); const color = m ? m.color : '#999';
  const overdue = t.status!=='done' && t.dueDate && t.dueDate < todayStr();
  const subDone = (t.subtasks||[]).filter(s=>s.done).length; const subTotal = (t.subtasks||[]).length;
  const pct = subTotal ? Math.round(subDone/subTotal*100) : 0;
  return `<div class="task-card" style="border-left-color:${color}" data-open="${t.id}">
    <div class="t-title">${escapeHtml(t.title)}</div>
    <div class="t-meta"><span class="badge due ${overdue?'overdue':''}">${fmtDate(t.dueDate)}</span><span class="badge pr-${t.priority}">${PRIORITY.find(p=>p.k===t.priority)?.l||''}</span><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block"></span><span>${m?escapeHtml(m.name):'미배정'}</span></div>
    ${t.tags && t.tags.length ? `<div class="t-tags">${t.tags.map(tg=>`<span class="tag">${escapeHtml(tg)}</span>`).join('')}</div>` : ''}
    ${subTotal ? `<div class="progress-wrap"><div class="progress-bar"><div style="width:${pct}%"></div></div><span class="progress-txt">${subDone}/${subTotal}</span></div>` : ''}
  </div>`;
}

/* ---------------- CALENDAR ---------------- */
function renderCalendar(){
  const y = state.calMonth.getFullYear(), mo = state.calMonth.getMonth();
  const first = new Date(y, mo, 1); const startOffset = first.getDay();
  const daysInMonth = new Date(y, mo+1, 0).getDate(); const daysInPrev = new Date(y, mo, 0).getDate();
  const cells = [];
  for(let i=startOffset-1;i>=0;i--) cells.push({d:daysInPrev-i, out:true, y: mo===0?y-1:y, m: mo===0?11:mo-1});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, out:false, y, m:mo});
  while(cells.length % 7 !== 0 || cells.length < 35) cells.push({d:cells.length-startOffset-daysInMonth+1, out:true, y: mo===11?y+1:y, m: mo===11?0:mo+1});
  const tasks = visibleTasks(); const byDate = {};
  tasks.forEach(t=>{ if(t.dueDate){ (byDate[t.dueDate] = byDate[t.dueDate]||[]).push(t); } });
  const dow = ['일','월','화','수','목','금','토'].map(n=>`<div class="cal-dow">${n}</div>`).join('');
  const cellsHtml = cells.map(c=>{
    const ds = c.y+'-'+String(c.m+1).padStart(2,'0')+'-'+String(c.d).padStart(2,'0');
    const isToday = ds === todayStr(); const items = (byDate[ds]||[]); const shown = items.slice(0,3); const more = items.length - shown.length;
    const chips = shown.map(t=>{ const m = memberById(t.assignee); return `<span class="cal-chip" style="background:${m?m.color:'#999'}" data-open="${t.id}">${escapeHtml(t.title)}</span>`; }).join('');
    return `<div class="cal-cell ${c.out?'out':''} ${isToday?'today':''}" data-day="${ds}"><div class="cal-daynum">${c.d}</div>${chips}${more>0?`<div class="cal-more">+${more}개 더</div>`:''}</div>`;
  }).join('');
  const monthLabel = y+'년 '+(mo+1)+'월';
  return `<div class="add-task-btn" id="new-task-btn" style="display:inline-flex">＋ 새 업무 만들기</div>
    <div class="cal-head"><div class="m-title">${monthLabel}</div><div class="cal-nav"><button id="cal-prev">‹</button><button id="cal-next">›</button></div></div>
    <div class="cal-grid">${dow}${cellsHtml}</div>`;
}

/* ---------------- MODAL ---------------- */
function openModal(taskOrNew){ state.modalTask = taskOrNew; renderModal(); }
function closeModal(){ state.modalTask = null; const ov=document.getElementById('modal-overlay'); if(ov) ov.remove(); }
function renderModal(){
  const isNew = state.modalTask === 'new';
  const t = isNew ? {id:null, title:'', assignee: state.me, dueDate:'', status:'todo', priority:'mid', tags:[], subtasks:[]} : state.tasks.find(x=>x.id===state.modalTask);
  if(!t) return;
  const overlay = document.createElement('div'); overlay.className='overlay'; overlay.id='modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>${isNew ? '새 업무' : '업무 수정'}</h3>
    <div class="field"><label>제목</label><input type="text" id="f-title" value="${escapeAttr(t.title)}" placeholder="예: 랜딩페이지 시안 작업"></div>
    <div class="row2">
      <div class="field"><label>담당자</label><select id="f-assignee">${state.members.map(m=>`<option value="${m.id}" ${m.id===t.assignee?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}</select></div>
      <div class="field"><label>마감일</label><input type="date" id="f-due" value="${t.dueDate||''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>상태</label><select id="f-status">${STATUS.map(s=>`<option value="${s.k}" ${s.k===t.status?'selected':''}>${s.l}</option>`).join('')}</select></div>
      <div class="field"><label>우선순위</label><select id="f-priority">${PRIORITY.map(p=>`<option value="${p.k}" ${p.k===t.priority?'selected':''}>${p.l}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>태그 (쉼표로 구분)</label><input type="text" id="f-tags" value="${escapeAttr((t.tags||[]).join(', '))}" placeholder="예: 디자인, 급함"></div>
    <div class="field"><label>하위 체크리스트</label><div id="subtask-list">${renderSubtasks(t.subtasks||[])}</div>
      <div class="subtask-add"><input type="text" id="subtask-input" placeholder="세부 항목 추가 후 Enter"><button id="subtask-add-btn" type="button">추가</button></div>
    </div>
    <div class="modal-actions"><div>${isNew?'':'<button class="btn danger small" id="delete-task">삭제</button>'}</div>
      <div><button class="btn ghost small" id="cancel-modal">취소</button><button class="btn primary small" id="save-task">저장</button></div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  let localSubtasks = JSON.parse(JSON.stringify(t.subtasks||[]));
  function refreshSubtasks(){ document.getElementById('subtask-list').innerHTML = renderSubtasks(localSubtasks); attachSubtaskEvents(); }
  function attachSubtaskEvents(){
    document.querySelectorAll('.subtask-row [data-tog]').forEach(cb=>{ cb.onchange = ()=>{ const s = localSubtasks.find(x=>x.id===cb.dataset.tog); if(s){ s.done = cb.checked; refreshSubtasks(); } }; });
    document.querySelectorAll('.subtask-row [data-del]').forEach(btn=>{ btn.onclick = ()=>{ localSubtasks = localSubtasks.filter(x=>x.id!==btn.dataset.del); refreshSubtasks(); }; });
  }
  attachSubtaskEvents();
  document.getElementById('subtask-add-btn').onclick = addSub;
  document.getElementById('subtask-input').onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addSub(); } };
  function addSub(){ const inp=document.getElementById('subtask-input'); const v=inp.value.trim(); if(!v) return; localSubtasks.push({id:uid(), text:v, done:false}); inp.value=''; refreshSubtasks(); document.getElementById('subtask-input').focus(); }
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('cancel-modal').onclick = closeModal;
  if(!isNew){ document.getElementById('delete-task').onclick = async ()=>{ await deleteTask(t.id); closeModal(); }; }
  document.getElementById('save-task').onclick = async ()=>{
    const title = document.getElementById('f-title').value.trim();
    if(!title){ document.getElementById('f-title').focus(); return; }
    const newTask = {
      id: t.id, title, assignee: document.getElementById('f-assignee').value, dueDate: document.getElementById('f-due').value,
      status: document.getElementById('f-status').value, priority: document.getElementById('f-priority').value,
      tags: document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean), subtasks: localSubtasks,
    };
    const ok = await upsertTask(newTask, isNew);
    if(ok) closeModal();
  };
  document.getElementById('f-title').focus();
}
function renderSubtasks(list){
  if(!list.length) return '<div style="font-size:12px;color:var(--ink-soft);padding:4px 0 8px;">아직 하위 항목이 없어요</div>';
  return list.map(s=>`<div class="subtask-row"><input type="checkbox" data-tog="${s.id}" ${s.done?'checked':''}><span class="${s.done?'done':''}">${escapeHtml(s.text)}</span><button data-del="${s.id}" type="button">×</button></div>`).join('');
}

/* ---------------- EVENTS ---------------- */
function attachShellEvents(){
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>{ b.onclick = ()=>{ state.tab = b.dataset.tab; render(); }; });
  document.getElementById('switch-me').onclick = ()=>{ state.me = null; render(); };
  document.getElementById('add-member-chip').onclick = ()=>{ document.getElementById('app').innerHTML = renderOnboarding(); attachOnboardEvents(); const d=document.getElementById('ob-done'); d.textContent='← 돌아가기'; d.onclick=()=>render(); };
  document.querySelectorAll('#roster [data-filter]').forEach(c=>{ c.onclick = ()=>{ const f=c.dataset.filter; state.filterMember = (f==='__all__') ? null : (state.filterMember===f ? null : f); render(); }; });
  const newBtn = document.getElementById('new-task-btn'); if(newBtn) newBtn.onclick = ()=> openModal('new');
  document.querySelectorAll('[data-open]').forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); openModal(el.dataset.open); }; });
  if(state.tab==='calendar'){
    const prev = document.getElementById('cal-prev'); const next = document.getElementById('cal-next');
    if(prev) prev.onclick = ()=>{ state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()-1, 1); render(); };
    if(next) next.onclick = ()=>{ state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+1, 1); render(); };
  }
}

/* ---------------- INIT ---------------- */
loadAll();
subscribeRealtime();
document.addEventListener('click', (e)=>{ if(e.target && e.target.id==='retry-btn') loadAll(); });
</script>
